# Each setting reads its environment variable explicitly (docs/architecture.md §6).
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
spring:
  application:
    name: objstore-controller
  lifecycle:
    timeout-per-shutdown-phase: 5s
  servlet:
    multipart:
      # Parts are read only after the 503 check, and staged to disk whole (decision 0004).
      resolve-lazily: true
      max-file-size: -1
      max-request-size: -1
      file-size-threshold: 0
      location: /tmp/objstore-uploads
  datasource:
    url: ${DATABASE_URL:jdbc:sqlite:/data/controller.db}
    hikari:
      maximum-pool-size: 4
      # Wait at most as long as SQLite's busy timeout for a free connection, not Hikari's 30 s.
      connection-timeout: 5000
      # Passed to the SQLite driver for every pooled connection (docs/architecture.md §11).
      data-source-properties:
        journal_mode: WAL
        synchronous: FULL
        foreign_keys: true
        busy_timeout: 5000
        transaction_mode: IMMEDIATE
logging:
  level:
    # Only an aborted download reaches Tomcat (ApiExceptionHandler handles everything else), and
    # it was logged where it failed; this stops Tomcat logging it a second time.
    "[org.apache.catalina.core.ContainerBase.[Tomcat].[localhost].[/].[dispatcherServlet]]": "OFF"
  structured:
    format:
      console: ecs
objstore:
  heartbeat-interval: ${HEARTBEAT_INTERVAL_MS:3000}
  suspect-after-missed: ${SUSPECT_AFTER_MISSED:3}
  dead-after-missed: ${DEAD_AFTER_MISSED:5}
  repair-concurrency: ${REPAIR_CONCURRENCY:4}
