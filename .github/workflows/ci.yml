name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Check formatting, compile, and run unit, property and integration tests
        run: ./mvnw -B verify
      - name: Build the images, including the client's
        run: docker compose --profile client build
