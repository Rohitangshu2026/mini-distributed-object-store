# Each setting reads its environment variable explicitly (docs/architecture.md §6).
server:
  port: ${SERVER_PORT:9000}
  shutdown: graceful
spring:
  application:
    name: objstore-worker
  lifecycle:
    timeout-per-shutdown-phase: 5s
  mvc:
    formcontent:
      filter:
        # curl sends a PUT body as form data by default; Spring must not consume it as a form.
        enabled: false
logging:
  structured:
    format:
      console: ecs
    json:
      add:
        worker_id: ${WORKER_ID:}
objstore:
  worker-id: ${WORKER_ID:}
  data-dir: ${DATA_DIR:/data}
  controller-url: ${CONTROLLER_URL:http://controller:8080}
  advertise-url: ${WORKER_ADVERTISE_URL:http://${WORKER_ID:}:9000}
  heartbeat-interval: ${HEARTBEAT_INTERVAL_MS:3000}
